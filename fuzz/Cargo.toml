[package]
name = "od3sa-recon-fuzz"
description = "cargo-fuzz targets for the od3sa-recon metadata parsers"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"
repository = "https://github.com/od3sa/od3sa-recon"
authors = ["Yakov Khalinsky"]

[package.metadata]
cargo-fuzz = true

[dependencies]
# MIT OR Apache-2.0. The only dependency of the fuzz crate, apart from the
# parser crate itself.
libfuzzer-sys = "0.4"
od3sa-parse = { path = "../crates/od3sa-parse", version = "0.1.2" }

[[bin]]
name = "radiotap"
path = "fuzz_targets/radiotap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ieee80211"
path = "fuzz_targets/ieee80211.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ie"
path = "fuzz_targets/ie.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capture"
path = "fuzz_targets/capture.rs"
test = false
doc = false
bench = false

# The fuzz crate is deliberately not a member of the workspace at the
# repository root: cargo-fuzz builds it with its own profile and its own
# lock file. This empty table makes it its own workspace root, so the root
# `cargo build` never tries to build the fuzz targets.
[workspace]
